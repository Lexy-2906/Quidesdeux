<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qui des deux ? - Spécial Arrowverse</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #021509, #062412, #020d05);
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 {
            color: #00ff88;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-align: center;
            font-size: 1.4rem;
            text-shadow: 0 0 12px rgba(0, 255, 136, 0.6);
        }
        .subtitle {
            color: #a3e635;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .game-container {
            width: 100%;
            max-width: 850px;
            background: rgba(4, 26, 12, 0.9);
            border: 2px solid #059669;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            position: relative;
        }
        .header-game {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #065f46;
            padding-bottom: 10px;
        }
        .round-indicator {
            font-size: 1rem;
            font-weight: bold;
            color: #34d399;
        }
        .universe-tag {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            background-color: #047857;
            color: #ffffff;
            border: 1px solid #10b981;
        }
        .question-box {
            font-size: 1.25rem;
            margin-bottom: 25px;
            font-weight: bold;
            color: #ecfdf5;
            text-align: center;
            background: rgba(6, 78, 59, 0.5);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #10b981;
            box-shadow: inset 0 0 10px rgba(0, 255, 136, 0.1);
        }
        .duo-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            position: relative;
            min-height: 140px;
        }
        .fighter-card {
            flex: 1;
            background: #062412;
            border: 2px solid #047857;
            border-radius: 10px;
            padding: 25px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            position: relative;
            z-index: 2;
        }
        .fighter-card:hover {
            border-color: #00ff88;
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }
        .fighter-card.selected {
            background: #047857;
            border-color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.9);
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .fighter-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
        }

        /* --- Grand Arc 3D Central --- */
        .center-bow-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100px;
            position: relative;
            z-index: 5;
        }
        .vs-badge {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .master-bow {
            width: 45px;
            height: 90px;
            border: 5px solid #a3e635;
            border-top: none;
            border-left: none;
            border-radius: 0 70px 70px 0;
            box-shadow: 3px 0 15px #00ff88, inset -2px 0 5px #fff;
            position: relative;
            transform: rotate(-90deg); /* Couché pour pointer des deux côtés */
            transition: transform 0.2s ease;
        }
        .master-bow.point-left {
            transform: rotate(90deg);
        }
        .master-bow.point-right {
            transform: rotate(-90deg);
        }
        .bow-string-main {
            position: absolute;
            top: 0;
            right: -3px;
            width: 2px;
            height: 90px;
            background: #ffffff;
            box-shadow: 0 0 8px #fff;
        }

        /* Flèche en vol grande vitesse */
        .flying-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 110px;
            height: 14px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            z-index: 10;
        }
        .arrow-shaft {
            position: absolute;
            top: 6px;
            left: 0;
            width: 95px;
            height: 3px;
            background: #a3e635;
            box-shadow: 0 0 10px #00ff88;
        }
        .arrow-head {
            position: absolute;
            right: 0;
            top: 1px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 15px solid #00ff88;
            filter: drop-shadow(0 0 8px #00ff88);
        }
        .arrow-feathers {
            position: absolute;
            left: 5px;
            top: 3px;
            width: 15px;
            height: 8px;
            background: #ffffff;
            clip-path: polygon(0 50%, 100% 0, 100% 100%);
        }

        @keyframes shootLeft {
            0% { transform: translate(-10px, -50%) scaleX(0.2); opacity: 1; }
            100% { transform: translate(-260px, -50%) scaleX(1); opacity: 1; }
        }
        @keyframes shootRight {
            0% { transform: translate(10px, -50%) scaleX(0.2); opacity: 1; }
            100% { transform: translate(260px, -50%) scaleX(1); opacity: 1; }
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn-next {
            background-color: #059669;
            color: white;
            border: 1px solid #34d399;
        }
        .btn-next:hover { background-color: #047857; }
        .feedback {
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
            font-size: 1rem;
            min-height: 24px;
            color: #00ff88;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
        }
    </style>
</head>
<body>

    <h1>Qui des deux ? — Arrowverse</h1>
    <div class="subtitle">Cliquez sur le choix du chat pour décocher la flèche géante !</div>

    <div class="game-container">
        <div class="header-game">
            <div class="round-indicator" id="roundIndicator">Manche 1 / 20</div>
            <div class="universe-tag">Team Arrow</div>
        </div>

        <div class="question-box" id="questionBox">Chargement...</div>

        <div class="duo-container">
            <div class="fighter-card" id="fighter1" onclick="selectWinner(1)">
                <div class="fighter-name" id="name1">Perso 1</div>
            </div>

            <div class="center-bow-zone">
                <div class="vs-badge">VS</div>
                <div class="master-bow" id="masterBow">
                    <div class="bow-string-main"></div>
                </div>
            </div>

            <div class="fighter-card" id="fighter2" onclick="selectWinner(2)">
                <div class="fighter-name" id="name2">Perso 2</div>
            </div>
            
            <!-- Flèche volante -->
            <div class="flying-arrow" id="flyingArrow">
                <div class="arrow-shaft"></div>
                <div class="arrow-head"></div>
                <div class="arrow-feathers"></div>
            </div>
        </div>

        <div class="controls">
            <div></div>
            <button class="btn btn-next" id="btnNext" onclick="nextRound()">Manche suivante ➔</button>
        </div>

        <div class="feedback" id="feedbackMsg"></div>
    </div>

    <script>
        const rounds = [
            { q: "Qui des deux a le pire sens de la famille ?", a: "Malcolm Merlyn", b: "Eobard Thawne (Reverse-Flash)" },
            { q: "Qui des deux fait le plus de discours larmoyants ?", a: "Oliver Queen", b: "Barry Allen" },
            { q: "Qui des deux a le plus pourri la vie amoureuse de tout le monde ?", a: "Felicity Smoak", b: "Iris West" },
            { q: "Qui des deux est le plus insupportable quand il est énervé ?", a: "Damian Darhk", b: "Cisco Ramon" },
            { q: "Qui des deux méritait le plus de finir en prison à vie ?", a: "Slade Wilson", b: "Mick Rory (Heat Wave)" },
            { q: "Qui des deux a le costume le plus ridicule ?", a: "Ray Palmer (Atom)", b: "John Diggle (Spartan)" },
            { q: "Qui des deux crie le plus souvent le nom de l'autre en pleurant ?", a: "Barry Allen", b: "Oliver Queen" },
            { q: "Qui des deux brise le plus de timelines par pur égoïsme ?", a: "Barry Allen", b: "Rip Hunter" },
            { q: "Qui des deux sort les répliques les plus cyniques et badass ?", a: "Leonard Snart (Captain Cold)", b: "Mick Rory" },
            { q: "Qui des deux a le pire taux de survie en couple à Star City ?", a: "Oliver Queen", b: "Thea Queen" },
            { q: "Qui des deux a le plan le plus incompréhensible à chaque saison ?", a: "Ra's al Ghul", b: "Cicada" },
            { q: "Qui des deux passe son temps à pirater n'importe quoi en 3 clics ?", a: "Felicity Smoak", b: "Cisco Ramon" },
            { q: "Qui des deux est le plus grand donneur de leçons moralisatrices ?", a: "John Diggle", b: "Martin Stein" },
            { q: "Qui des deux a eu la résurrection la moins crédible ?", a: "Sara Lance", b: "Thea Queen" },
            { q: "Qui des deux a le look de méchant le plus cliché ?", a: "Vandal Savage", b: "Damian Darhk" },
            { q: "Qui des deux court partout en panique en criant au secours ?", a: "Quentin Lance", b: "Joe West" },
            { q: "Qui des deux est le plus traumatisé par son passé sur une île ou en Russie ?", a: "Oliver Queen", b: "Slade Wilson" },
            { q: "Qui des deux gère le moins bien ses pouvoirs de vitesse ?", a: "Wally West", b: "Nora West-Allen" },
            { q: "Qui des deux a le plus de fois changé d'allégeance au cours des saisons ?", a: "Malcolm Merlyn", b: "John Constantine" },
            { q: "Qui des deux mérite le titre de véritable pilier indestructible de l'Arrowverse ?", a: "Oliver Queen", b: "Barry Allen" }
        ];

        let currentRound = 0;

        function playArrowSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1000, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.25);
                
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                
                osc.start(); 
                osc.stop(ctx.currentTime + 0.25);
            } catch(e) {}
        }

        function loadRound() {
            if (currentRound >= rounds.length) {
                currentRound = 0;
            }
            const data = rounds[currentRound];
            document.getElementById('roundIndicator').textContent = `Manche ${currentRound + 1} / ${rounds.length}`;
            document.getElementById('questionBox').textContent = data.q;
            document.getElementById('name1').textContent = data.a;
            document.getElementById('name2').textContent = data.b;
            
            document.getElementById('fighter1').classList.remove('selected');
            document.getElementById('fighter2').classList.remove('selected');
            document.getElementById('feedbackMsg').textContent = '';
            
            const bow = document.getElementById('masterBow');
            bow.className = 'master-bow'; // Remet droit au centre

            const arrow = document.getElementById('flyingArrow');
            arrow.style.animation = 'none';
            arrow.style.opacity = '0';
        }

        function selectWinner(fighterNum) {
            playArrowSound();
            document.getElementById('fighter1').classList.remove('selected');
            document.getElementById('fighter2').classList.remove('selected');
            
            document.getElementById(`fighter${fighterNum}`).classList.add('selected');
            
            const bow = document.getElementById('masterBow');
            const arrow = document.getElementById('flyingArrow');
            
            arrow.style.animation = 'none';
            void arrow.offsetWidth; // Reset animation
            
            if (fighterNum === 1) {
                bow.className = 'master-bow point-left';
                arrow.style.animation = 'shootLeft 0.25s ease-out forwards';
            } else {
                bow.className = 'master-bow point-right';
                arrow.style.animation = 'shootRight 0.25s ease-out forwards';
            }

            const winnerName = document.getElementById(`name${fighterNum}`).textContent;
            document.getElementById('feedbackMsg').textContent = `🎯 En plein dans le mille : ${winnerName} !`;
        }

        function nextRound() {
            currentRound++;
            loadRound();
        }

        window.onload = loadRound;
    </script>
</body>
</html>
